name: Build Snapshot (amd64, GHCR)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to build (non-amd64 is emulated and slow)"
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/arm/v6

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up variables
        id: variable
        run: |
          echo "platform=${{ inputs.platform || 'linux/amd64' }}" >> "$GITHUB_OUTPUT"
          echo "build_unix_time=$(date '+%s')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=SNAPSHOT-{{date 'YYYYMMDD'}}-${{ github.run_id }}
            type=raw,value=SNAPSHOT-{{date 'YYYYMMDD'}}
            type=raw,value=latest-snapshot

      - name: Set up QEMU
        if: ${{ steps.variable.outputs.platform != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          source: .
          targets: image
          set: |
            *.platform=${{ steps.variable.outputs.platform }}
            *.args.BUILD_PIPELINE=1
            *.args.BUILD_UNIXTIME=${{ steps.variable.outputs.build_unix_time }}
            *.args.BUILD_DATE=${{ steps.variable.outputs.build_date }}
            *.args.BUILD_NODE_OPTIONS=${{ vars.BUILD_NODE_OPTIONS }}
            *.args.CHECK_3RD_API=${{ vars.CHECK_3RD_API }}
            *.args.SKIP_TESTS=${{ vars.SKIP_TESTS }}
            *.output=type=image,push=true
